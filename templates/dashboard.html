<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SADUD Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">SADUD</span>
    <a href="/logout" class="btn btn-sm btn-light">Logout</a>
  </div>
</nav>

<div class="container mt-3">

  <!-- MENU -->
  <div class="row g-2 mb-3">
    <div class="col-6">
      <a href="/barang" class="btn btn-outline-primary w-100">📦 Barang</a>
    </div>
    <div class="col-6">
      <a href="/penjualan" class="btn btn-outline-success w-100">🛒 Penjualan</a>
    </div>
  </div>

  <!-- GRAFIK -->
  <div class="card">
    <div class="card-body">
      <h6 class="card-title">Grafik Penjualan</h6>
      <canvas id="chartPenjualan"></canvas>
    </div>
  </div>

</div>

<script>
fetch("/api/grafik")
.then(res => res.json())
.then(data => {
  new Chart(document.getElementById("chartPenjualan"), {
    type: "line",
    data: {
      labels: data.tanggal,
      datasets: [{
        label: "Penjualan",
        data: data.total,
        fill: true,
        tension: 0.4
      }]
    }
  })
})
</script>

</body>
</html>
