<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login SADUD</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
<div class="card p-3">

<h5 class="text-center mb-3">Login SADUD</h5>

<form method="post">
  <input class="form-control mb-2" name="username" placeholder="Username">
  <input class="form-control mb-2" type="password" name="password" placeholder="Password">
  <button class="btn btn-primary w-100">Login</button>
</form>

<hr>

<button onclick="fingerLogin()" class="btn btn-success w-100">
🔐 Login dengan Fingerprint
</button>

</div>
</div>

<script>
async function fingerLogin() {
  if (!window.PublicKeyCredential) {
    alert("Browser tidak mendukung fingerprint");
    return;
  }

  alert("Tempelkan jari / Face ID");
  fetch("/finger-login")
  .then(r => r.json())
  .then(d => {
    if (d.success) location.href="/dashboard";
    else alert("Fingerprint gagal");
  })
}
</script>

</body>
</html>
